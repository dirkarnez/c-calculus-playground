name: cpp-emscripten-prebuilt-release-actions-workflow
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
    contents: write
    
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      targetZip: ${{ github.event.repository.name }}-${{ github.ref_name }}-emscripten.zip
    steps:
      - uses: actions/checkout@v4

    # The branch, tag or SHA to checkout. When checking out the repository that
    # triggered a workflow, this defaults to the reference or SHA for that event.
    # Otherwise, uses the default branch.
      - uses: actions/checkout@v4
        with:
          ref: 'main'
          path: 'committing'
      
      - name: Build
        run: |
          docker run \
          --rm \
          -v $(pwd):/src \
          -u $(id -u):$(id -g) \
          emscripten/emsdk \
          emcc -lembind -o calculus.js ./src/calculus.cpp

# #!/bin/bash
# em++ --bind cpp-code.cpp --post-js js-code.js -o output.js
# node output.js

      - run: cp -f 'calculus.js' 'committing'
          
      - run: cp -f 'calculus.wasm' 'committing'
          
      - run: cp -f 'index.html' 'committing'

      - uses: EndBug/add-and-commit@v9 # You can change this to use a specific version.
        with:
          cwd: 'committing'
          # The arguments for the `git add` command (see the paragraph below for more info)
          # Default: '.'
          # add: '["fnmatch.js", "fnmatch.wasm", "index.html"]'
          
      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          path: |
            calculus.js
            calculus.wasm
            index.html
          filename: "${{ env.targetZip }}"

      - name: Release prebuilt
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.targetZip }}"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
